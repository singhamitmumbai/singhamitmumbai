[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-ai"
version = "1.22.0"
description = "Complete AI + Finderbay Assistant: ChatGPT-level chat + proto-AGI gap stack (learning/transfer/horizon/memory)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amit" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
perception = ["vosk>=0.3.45", "pytesseract>=0.3.10", "Pillow>=10.0"]
vision = ["ultralytics>=8.0", "opencv-python-headless>=4.8", "numpy>=1.24"]
all = ["cognitive-ai[dev,perception,vision]"]

[project.scripts]
cognitive-ai = "cognitive_ai.cli:main"
cognitive-os = "cognitive_ai.os.__main__:main"

[tool.setuptools.packages.find]
include = ["cognitive_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
