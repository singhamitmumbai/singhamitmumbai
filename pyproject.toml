[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-ai"
version = "0.4.0"
description = "Complete non-LLM AI — Finderbay assistant + symbolic cognitive OS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amit" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
cognitive-ai = "cognitive_ai.cli:main"
cognitive-os = "cognitive_ai.os.__main__:main"

[tool.setuptools.packages.find]
include = ["cognitive_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
