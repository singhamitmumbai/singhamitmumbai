<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Complete AI — Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/chat.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="app">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div class="brand-text">
        <h1>Complete AI</h1>
        <p class="tagline">Chat · tasks · vision · coding · agent</p>
      </div>
      <div class="status-pill" id="statusPill">booting…</div>
    </header>

    <main class="layout">
      <aside class="rail" id="rail">
        <section>
          <h2>Status</h2>
          <dl id="mindStats"></dl>
        </section>
        <section>
          <h2>Quick</h2>
          <div class="chips">
            <button type="button" data-prompt="Who are you?">Who are you?</button>
            <button type="button" data-prompt="Show unpaid invoices for Project A">Invoices</button>
            <button type="button" data-prompt="Can penguins fly?">Penguins</button>
            <button type="button" data-prompt="Count people in image ./crowd_people.jpg">Vision</button>
            <button type="button" data-prompt="generate function add(a, b)">Code</button>
            <button type="button" data-prompt="Show alerts for Project A">Alerts</button>
          </div>
        </section>
        <section>
          <h2>System</h2>
          <div class="chips">
            <button type="button" data-cmd="/status">Status</button>
            <button type="button" data-cmd="/diag">Diagnostics</button>
            <button type="button" data-cmd="/reset">Reset session</button>
          </div>
        </section>
      </aside>

      <section class="chat-panel">
        <div class="messages" id="messages" role="log" aria-live="polite"></div>
        <form class="composer" id="composer">
          <label class="sr-only" for="input">Message</label>
          <textarea id="input" rows="1" placeholder="Ask Complete AI anything — chat, invoices, vision, code…"></textarea>
          <button type="submit" id="send">Send</button>
        </form>
        <p class="hint">Set <code>OPENAI_API_KEY</code> for ChatGPT-class chat. <code>human_level_agi=false</code></p>
      </section>
    </main>
  </div>
  <script src="/static/chat.js"></script>
</body>
</html>
