name: Complete AI CI

on:
  push:
    branches: [main, master, "cursor/**"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Pytest
        env:
          COMPLETE_AI_LIFELONG_PERSIST: "0"
          COMPLETE_AI_CONTINUOUS_LEARNING: "0"
        run: pytest -q
      - name: Completeness
        run: python -m cognitive_ai completeness
      - name: Full-test gate
        env:
          COMPLETE_AI_LIFELONG_PERSIST: "0"
          COMPLETE_AI_CONTINUOUS_LEARNING: "0"
        run: python -m cognitive_ai full-test
